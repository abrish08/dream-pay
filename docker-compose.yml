# The SAME image, three ways:
#
#   Monolith:       docker compose --profile mono up --build
#                   all modules in one process, in-memory bus, one database.
#
#   Microservices:  docker compose --profile micro up --build
#                   every module is its own service with its OWN database;
#                   modules talk only through NATS; "edge" routes HTTP by path.
#
# Either way, call http://localhost:8080. Secrets come from .env (create it
# with ./scripts/run.sh env); compose refuses to start if one is missing. In
# production load them from a secret manager.

# Every service: the PUBLIC key to verify access tokens locally.
x-common: &common
  AUTH_PUBLIC_KEYS: ${AUTH_PUBLIC_KEYS:?create .env with ./scripts/run.sh env}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?create .env with ./scripts/run.sh env}
  WEBHOOK_ALLOW_INSECURE: "true"
  PUBLIC_BASE_URL: http://localhost:8080

# Only the auth service: the PRIVATE signing key, the API key pepper and the
# first admin account. Never give these to other services.
x-auth-secrets: &auth-secrets
  AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?create .env with ./scripts/run.sh env}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?create .env with ./scripts/run.sh env}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?create .env with ./scripts/run.sh env}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?create .env with ./scripts/run.sh env}

# KYC documents in MinIO (private bucket, server-side encryption). The app
# talks to minio:9000; download links use localhost:9000 (what browsers reach).
x-kyc-storage: &kyc-storage
  KYC_STORAGE: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-paygate}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?create .env with ./scripts/run.sh env}
  MINIO_BUCKET: kyc-documents
  KYC_S3_SSE: "true"
  FAYDA_CLIENT_ID: ${FAYDA_CLIENT_ID:-}
  FAYDA_PRIVATE_KEY: ${FAYDA_PRIVATE_KEY:-}
  FAYDA_ISSUER: ${FAYDA_ISSUER:-https://esignet.ida.fayda.et}

x-service: &service
  build: .
  restart: unless-stopped
  profiles: [micro]
  depends_on:
    postgres: { condition: service_healthy }
    nats: { condition: service_started }

x-micro-env: &micro-env
  <<: *common
  BUS: nats
  NATS_URL: nats://nats:4222

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gateway
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployments/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    profiles: [mono, micro]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-paygate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?create .env with ./scripts/run.sh env}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?create .env with ./scripts/run.sh env}  # enables SSE
    ports: ["9000:9000", "9001:9001"]   # 9001: MinIO console
    volumes: ["miniodata:/data"]        # KYC documents: back this volume up
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  # ---------------- monolith ----------------
  paygate:
    build: .
    restart: unless-stopped
    profiles: [mono]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      <<: [*common, *auth-secrets, *kyc-storage]
      MODULES: all
      BUS: memory
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gateway?sslmode=disable

  # ---------------- microservices: one per module ----------------
  nats:
    image: nats:2.10-alpine
    profiles: [micro]
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222"]

  merchant:
    <<: *service
    environment:
      <<: *micro-env
      MODULES: merchant
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_merchant?sslmode=disable

  auth:
    <<: *service
    environment:
      <<: [*micro-env, *auth-secrets]
      MODULES: auth
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_auth?sslmode=disable

  provider:
    <<: *service
    environment:
      <<: *micro-env
      MODULES: provider
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_provider?sslmode=disable

  payment:
    <<: *service
    deploy: { replicas: 2 } # replicas share the load through NATS queue groups
    environment:
      <<: *micro-env
      MODULES: payment
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_payment?sslmode=disable

  refund:
    <<: *service
    environment:
      <<: *micro-env
      MODULES: refund
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_refund?sslmode=disable

  ledger:
    <<: *service
    environment:
      <<: *micro-env
      MODULES: ledger
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_ledger?sslmode=disable

  webhook:
    <<: *service
    environment:
      <<: *micro-env
      MODULES: webhook
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_webhook?sslmode=disable

  reconciliation:
    <<: *service
    environment:
      <<: *micro-env
      MODULES: reconciliation
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_reconciliation?sslmode=disable

  kyc:
    <<: *service
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
      minio: { condition: service_healthy }
    environment:
      <<: [*micro-env, *kyc-storage]
      MODULES: kyc
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_kyc?sslmode=disable

  payout:
    <<: *service
    environment:
      <<: *micro-env
      MODULES: payout
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gw_payout?sslmode=disable

  edge:
    build: .
    profiles: [micro]
    entrypoint: ["/edge"]
    ports: ["8080:8080"]
    environment:
      EDGE_ADDR: ":8080"
      ROUTES: >-
        /auth=http://auth:8080,
        /.well-known=http://auth:8080,
        /v1/api-keys=http://auth:8080,
        /v1/team=http://auth:8080,
        /v1/roles=http://auth:8080,
        /v1/permissions=http://auth:8080,
        /v1/audit-log=http://auth:8080,
        /admin/users=http://auth:8080,
        /admin/roles=http://auth:8080,
        /admin/permissions=http://auth:8080,
        /admin/audit-log=http://auth:8080,
        /openapi.yaml=http://auth:8080,
        /docs=http://auth:8080,
        /swagger=http://auth:8080,
        /v1/merchant=http://merchant:8080,
        /v1/payouts=http://payout:8080,
        /admin/payouts=http://payout:8080,
        /v1/kyc=http://kyc:8080,
        /admin/kyc=http://kyc:8080,
        /kyc=http://kyc:8080,
        /admin/merchants=http://merchant:8080,
        /admin/merchants/*/api-keys=http://auth:8080,
        /providers=http://provider:8080,
        /v1/payments=http://payment:8080,
        /pay=http://payment:8080,
        /v1/payment-methods=http://provider:8080,
        /admin/providers=http://provider:8080,
        /v1/refunds=http://refund:8080,
        /v1/balance=http://ledger:8080,
        /admin/ledger=http://ledger:8080,
        /v1/webhook-endpoints=http://webhook:8080,
        /v1/webhook-deliveries=http://webhook:8080,
        /admin/reconciliation=http://reconciliation:8080

volumes:
  pgdata:
  miniodata:
