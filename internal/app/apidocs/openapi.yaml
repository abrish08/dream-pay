openapi: 3.0.3
info:
  title: Paygate API
  version: "1.1"
  description: |
    Payments, refunds, payouts and webhooks.

    * **Auth:** `Authorization: Bearer <API key or access token>`. Servers use an API key
      (`sk_test_…` / `sk_live_…`); people use the access token from `POST /auth/login`.
    * **Amounts:** integers in minor units (`150000` = 1,500.00 ETB).
    * **Idempotency:** money-moving `POST`s need a unique `Idempotency-Key` header.
    * **Errors:** `{"error": {"kind", "code", "message"}}`.
servers:
  - url: http://localhost:8080
    description: Local
security:
  - bearer: []
tags:
  - {name: Auth, description: Sign up, log in, tokens, password reset, Google / Apple}
  - {name: Payments}
  - {name: Refunds}
  - {name: Balance & payouts}
  - {name: Webhooks}
  - {name: API keys}
  - {name: Team & roles, description: "Merchant team members and custom roles (logged-in users)"}
  - {name: KYC, description: "Business verification: required before live payments"}
  - {name: Admin - merchants & users}
  - {name: Admin - KYC}
  - {name: Disputes, description: "Chargebacks: respond with evidence before the deadline"}
  - {name: Admin - risk & disputes}
  - {name: Admin - roles}
  - {name: Admin - money}
  - {name: Hosted pages & providers, description: Called by customers' browsers and by payment providers}
  - {name: System}

paths:
  # ---------------- Auth ----------------
  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up a merchant (email + password)
      description: |
        Creates a **pending** merchant and its owner and sends a **6-digit verification code** (email,
        or SMS through send.et with `verification_channel: sms` and a phone). **No token until the code
        is confirmed** with `POST /auth/verify`. Test mode works right after; live mode after staff
        approval. One account per email: an existing email (password, Google or Apple) is `409 email_taken`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"business_name": "Abebe Coffee PLC", "name": "Abebe Kebede", "email": "abebe@abebecoffee.et", "password": "Str0ng-Passw0rd!2026", "phone": "+251911234567", "website": "https://abebecoffee.et", "verification_channel": "email"}
            schema:
              type: object
              required: [business_name, email, password]
              properties:
                business_name: {type: string, example: Abebe Coffee}
                name: {type: string, example: Abebe Kebede}
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 128}
                phone: {type: string, example: "+251911000000"}
                website: {type: string}
                verification_channel: {type: string, enum: [email, sms], default: email}
      responses:
        "201":
          description: Account created; verification code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_required: {type: boolean, example: true}
                  email: {type: string}
                  channel: {type: string, enum: [email, sms]}
                  message: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: |
        Returns an access token (5 min) and a refresh token. 5 wrong passwords lock the account for
        15 minutes (`401 account_locked`).
        * Account not verified yet: `403 verification_required` and a new code is sent.
        * Authenticator app enabled: the answer is `{mfa_required: true, mfa_token}`; finish with
          `POST /auth/login/mfa`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"email": "abebe@abebecoffee.et", "password": "Str0ng-Passw0rd!2026"}
            schema: {type: object, required: [email, password], properties: {email: {type: string}, password: {type: string}}}
      responses:
        "200": {$ref: "#/components/responses/Tokens"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/oauth/{provider}:
    post:
      tags: [Auth]
      summary: Sign in / sign up with Google or Apple
      description: |
        Your app signs the user in with Google or Apple and sends us the **ID token**.
        * Linked account: logged in (`200`).
        * Not linked, but an account uses the same (verified) email: the Google/Apple account is
          **linked** to it and the user is logged in (`200`) — never a second account. If that
          account's email was never verified, its password is removed for safety (use
          *forgot password* to set one again).
        * No account: send `business_name` to sign up (`201`), otherwise `404 account_not_found`.
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, enum: [google, apple]}}
      requestBody:
        required: true
        content:
          application/json:
            example: {"id_token": "eyJhbGciOiJSUzI1NiIsImtpZCI6ImV4YW1wbGUifQ.eyJpc3MiOiJodHRwczovL2FjY291bnRzLmdvb2dsZS5jb20ifQ.c2lnbmF0dXJl", "nonce": "n-0S6_WzA2Mj", "business_name": "Abebe Coffee PLC"}
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: {type: string, description: ID token from Google / Apple sign-in}
                nonce: {type: string, description: The nonce your app used (raw or SHA-256), recommended}
                business_name: {type: string, description: Only to sign up}
                name: {type: string, description: "Apple sends the name only to your app, on the first sign-in"}
                phone: {type: string}
                website: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Tokens"}
        "201": {$ref: "#/components/responses/Tokens"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /auth/verify:
    post:
      tags: [Auth]
      summary: Confirm the 6-digit code; activates the account and logs in
      description: Codes expire after 15 minutes, work once, and die after 5 wrong tries. Staff accounts and accounts created by staff never need this.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"email": "abebe@abebecoffee.et", "code": "482913"}
            schema: {type: object, required: [email, code], properties: {email: {type: string}, code: {type: string, example: "482913"}}}
      responses:
        "200": {$ref: "#/components/responses/Tokens"}
        "400": {$ref: "#/components/responses/Error"}
  /auth/verify/resend:
    post:
      tags: [Auth]
      summary: Send a new verification code
      description: Always `202` (no account enumeration). At most one code per minute and 5 per hour; a new code replaces the old one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"email": "abebe@abebecoffee.et", "channel": "email"}
            schema: {type: object, required: [email], properties: {email: {type: string}, channel: {type: string, enum: [email, sms], default: email}}}
      responses:
        "202": {description: A code is on its way if the account is waiting for verification}
  /auth/login/mfa:
    post:
      tags: [Auth]
      summary: Second sign-in step with the authenticator code (or a recovery code)
      description: The `mfa_token` from the first step lives 5 minutes and allows 5 tries. A code is accepted only once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"mfa_token": "mfa_RXhhbXBsZUNoYWxsZW5nZVRva2Vu", "code": "123456"}
            schema: {type: object, required: [mfa_token, code], properties: {mfa_token: {type: string}, code: {type: string, example: "123456"}}}
      responses:
        "200": {$ref: "#/components/responses/Tokens"}
        "401": {$ref: "#/components/responses/Error"}
  /auth/mfa:
    get:
      tags: [Auth]
      summary: Is the authenticator app enabled; recovery codes left
      responses:
        "200":
          description: Status
          content: {application/json: {schema: {type: object, properties: {enabled: {type: boolean}, enabled_at: {type: string, format: date-time}, recovery_codes_left: {type: integer}}}}}
  /auth/mfa/totp/setup:
    post:
      tags: [Auth]
      summary: Start authenticator setup (Microsoft Authenticator, Google Authenticator...)
      description: |
        Show `qr_code` (a PNG data URL: `<img src="...">`) for the user to scan, or `secret` for "enter code manually",
        then confirm with the first code. Every user has their own secret, stored encrypted (AES-256-GCM). The app shows
        `issuer`: "Paygate - <business name>" for merchant users, "Paygate Admin" for staff. Staff must use MFA on /admin
        (REQUIRE_STAFF_MFA), merchant users on /v1 (REQUIRE_MERCHANT_MFA) and for payouts (REQUIRE_MFA_FOR_PAYOUTS);
        sessions signed in before enrolling must sign in again (`403 mfa_required`).
      responses:
        "200":
          description: Setup
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: {type: string}
                  otpauth_url: {type: string, example: "otpauth://totp/Paygate:you@shop.com?secret=...&issuer=Paygate"}
                  issuer: {type: string}
                  account: {type: string}
        "409": {$ref: "#/components/responses/Error"}
  /auth/mfa/totp/confirm:
    post:
      tags: [Auth]
      summary: Confirm setup with a code from the app; returns 10 recovery codes (shown once)
      requestBody:
        required: true
        content: {application/json: {example: {"code": "123456"}, schema: {type: object, required: [code], properties: {code: {type: string}}}}}
      responses:
        "200":
          description: Enabled
          content: {application/json: {schema: {type: object, properties: {enabled: {type: boolean}, recovery_codes: {type: array, items: {type: string}}, warning: {type: string}}}}}
        "401": {$ref: "#/components/responses/Error"}
  /auth/mfa/totp/disable:
    post:
      tags: [Auth]
      summary: Turn the authenticator off (password + authenticator or recovery code)
      requestBody:
        required: true
        content: {application/json: {example: {"password": "Str0ng-Passw0rd!2026", "code": "123456"}, schema: {type: object, required: [code], properties: {password: {type: string}, code: {type: string}}}}}
      responses:
        "204": {description: Disabled}
        "401": {$ref: "#/components/responses/Error"}
  /auth/refresh:
    post:
      tags: [Auth]
      summary: New access token from a refresh token
      description: The refresh token rotates on every use; re-using an old one signs the user out everywhere (theft detection).
      security: []
      requestBody:
        required: true
        content: {application/json: {example: {"refresh_token": "rt_RXhhbXBsZVJlZnJlc2hUb2tlbg"}, schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}}}
      responses:
        "200": {$ref: "#/components/responses/Tokens"}
        "401": {$ref: "#/components/responses/Error"}
  /auth/logout:
    post:
      tags: [Auth]
      summary: End a session (revoke the refresh token)
      security: []
      requestBody:
        required: true
        content: {application/json: {example: {"refresh_token": "rt_RXhhbXBsZVJlZnJlc2hUb2tlbg"}, schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}}}
      responses:
        "204": {description: Logged out}
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: Always `202`, whether or not the email has an account (no account enumeration). The link works once and expires (30 minutes by default). At most 3 emails per account per hour.
      security: []
      requestBody:
        required: true
        content: {application/json: {example: {"email": "abebe@abebecoffee.et"}, schema: {type: object, required: [email], properties: {email: {type: string}}}}}
      responses:
        "202": {description: If the account exists, an email is on its way}
        "429": {$ref: "#/components/responses/Error"}
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Set a new password with the emailed token
      description: Signs the user out everywhere and emails a "password changed" notice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"token": "prt_RXhhbXBsZVJlc2V0VG9rZW4", "new_password": "N3w-Str0ng-Passw0rd!"}
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: {type: string, example: prt_...}
                new_password: {type: string, minLength: 12, maxLength: 128}
      responses:
        "204": {description: Password changed}
        "400": {$ref: "#/components/responses/Error"}
  /auth/password:
    post:
      tags: [Auth]
      summary: Change your password (current password + authenticator code)
      description: |
        Needs a code from your authenticator app (Microsoft Authenticator). Without an authenticator
        set up: `403 mfa_enrollment_required` (use `/auth/mfa/totp/setup` first). Signs you out
        everywhere and emails a notice.
      requestBody:
        required: true
        content:
          application/json:
            example: {"current_password": "Str0ng-Passw0rd!2026", "new_password": "N3w-Str0ng-Passw0rd!", "totp_code": "123456"}
            schema:
              type: object
              required: [current_password, new_password, totp_code]
              properties:
                current_password: {type: string}
                new_password: {type: string, minLength: 12}
                totp_code: {type: string, example: "123456"}
      responses:
        "204": {description: Changed}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /auth/me:
    get:
      tags: [Auth]
      summary: Who am I (user with roles and permissions, or the API key)
      responses:
        "200": {description: Current user, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
  /.well-known/jwks.json:
    get:
      tags: [Auth]
      summary: Public keys that verify access tokens (EdDSA)
      security: []
      responses:
        "200": {description: JSON Web Key Set}

  # ---------------- Merchant: payments ----------------
  /v1/merchant:
    get:
      tags: [Payments]
      summary: Your merchant account (status, fee)
      responses:
        "200": {description: Merchant, content: {application/json: {schema: {$ref: "#/components/schemas/Merchant"}}}}
  /v1/payment-methods:
    get:
      tags: [Payments]
      summary: Payment methods you can offer right now
      description: Test keys see every method (sandbox). Live methods depend on the providers connected.
      parameters:
        - {name: currency, in: query, schema: {type: string, default: ETB}}
        - {name: environment, in: query, schema: {type: string, enum: [live, test]}, description: Dashboard users only}
      responses:
        "200":
          description: Methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        method: {type: string, example: telebirr}
                        label: {type: string, example: telebirr}
                        available: {type: boolean}
  /v1/payments:
    post:
      tags: [Payments]
      summary: Create a payment (payments:write)
      description: Returns a `checkout_url`; redirect your customer there. Needs an API key.
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {example: {"amount": 150000, "currency": "ETB", "payment_method": "telebirr", "reference": "ORDER-1001", "description": "2 x Yirgacheffe coffee 500g", "metadata": {"order_id": "1001", "customer_id": "C-77"}, "customer": {"email": "hana@example.com", "name": "Hana Tesfaye"}, "return_url": "https://abebecoffee.et/orders/1001/thanks", "expires_in_minutes": 30}, schema: {$ref: "#/components/schemas/CreatePayment"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Payment"}}}}
        "200": {description: Replayed (same Idempotency-Key), content: {application/json: {schema: {$ref: "#/components/schemas/Payment"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    get:
      tags: [Payments]
      summary: List payments (payments:read)
      parameters:
        - {name: status, in: query, schema: {type: string}, description: "Comma list, e.g. succeeded,refunded"}
        - {name: reference, in: query, schema: {type: string}}
        - {name: created_from, in: query, schema: {type: string, format: date-time}}
        - {name: created_to, in: query, schema: {type: string, format: date-time}}
        - {name: environment, in: query, schema: {type: string, enum: [live, test]}, description: Dashboard users only}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/StartingAfter"}
      responses:
        "200": {description: One page, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentPage"}}}}
  /v1/payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment (payments:read)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Payment, content: {application/json: {schema: {$ref: "#/components/schemas/Payment"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/payments/{id}/events:
    get:
      tags: [Payments]
      summary: The payment's history, oldest first (payments:read)
      description: |
        Every status change, written in the same transaction as the change and never rewritten
        (the database refuses edits). `source` says who caused it: `merchant_api`, `customer`,
        `provider` (notification, verified with the provider), `status_check` (our scheduled check),
        `expiry`, `refund`, `reconciliation`. `details` keeps what the provider answered.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/PaymentEvents"}
        "404": {$ref: "#/components/responses/Error"}

  # ---------------- Refunds ----------------
  /v1/refunds:
    post:
      tags: [Refunds]
      summary: Refund a payment, fully or partly (refunds:write)
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            example: {"payment_id": "7b9e2c1a-3f4d-4e8a-9b6c-1d2e3f4a5b6c", "amount": 50000, "reason": "Customer returned one item"}
            schema:
              type: object
              required: [payment_id]
              properties:
                payment_id: {type: string, format: uuid}
                amount: {type: integer, format: int64, description: "Minor units; omit or 0 to refund everything still refundable"}
                reason: {type: string}
      responses:
        "201": {description: Created (may be pending while the provider answers), content: {application/json: {schema: {$ref: "#/components/schemas/Refund"}}}}
        "200": {description: Replayed, content: {application/json: {schema: {$ref: "#/components/schemas/Refund"}}}}
        "422": {$ref: "#/components/responses/Error"}
    get:
      tags: [Refunds]
      summary: List refunds (payments:read)
      parameters:
        - {name: payment_id, in: query, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/StartingAfter"}
      responses:
        "200": {description: One page, content: {application/json: {schema: {$ref: "#/components/schemas/RefundPage"}}}}
  /v1/refunds/{id}:
    get:
      tags: [Refunds]
      summary: Get a refund (payments:read)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Refund, content: {application/json: {schema: {$ref: "#/components/schemas/Refund"}}}}
        "404": {$ref: "#/components/responses/Error"}

  # ---------------- Balance & payouts ----------------
  /v1/balance:
    get:
      tags: [Balance & payouts]
      summary: Your balance (balance:read)
      parameters:
        - {name: currency, in: query, schema: {type: string, default: ETB}}
        - {name: environment, in: query, schema: {type: string, enum: [live, test]}, description: Dashboard users only}
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: {type: string}
                  environment: {type: string}
                  available: {type: integer, format: int64, description: Can be paid out}
                  reserved: {type: integer, format: int64, description: Rolling reserve; each part becomes available after reserve_days}
                  dispute_hold: {type: integer, format: int64, description: Held for open disputes}
                  pending_payouts: {type: integer, format: int64, description: Held for payouts not sent yet}
  /v1/payment-links:
    post:
      tags: [Payments]
      summary: Create a payment link to share (payments:write)
      description: |
        Share `url` (chat, SMS, invoice, QR on a counter). Each visit opens a payment on the hosted checkout page, where the
        customer picks the method. `single_use` (an invoice) closes once paid; visits at the same time get the same payment.
        Without it the link is reusable (a price tag). Live links need approved KYC.
      requestBody:
        required: true
        content:
          application/json:
            example: {"amount": 250000, "currency": "ETB", "description": "Invoice 77: 5 bags of coffee", "reference": "INV-77", "single_use": true, "expires_at": "2026-12-01T00:00:00Z"}
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount: {type: integer}
                currency: {type: string, enum: [ETB, USD]}
                description: {type: string}
                reference: {type: string, description: "Prefix of each payment's reference"}
                single_use: {type: boolean}
                expires_at: {type: string, format: date-time}
                environment: {type: string, enum: [live, test], description: Dashboard users only}
      responses:
        "201": {$ref: "#/components/responses/PaymentLink"}
        "400": {$ref: "#/components/responses/Error"}
    get:
      tags: [Payments]
      summary: Your payment links, newest first (payments:read)
      parameters: [{$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Links}}
  /v1/payment-links/{id}:
    get:
      tags: [Payments]
      summary: A payment link (payments:read)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {$ref: "#/components/responses/PaymentLink"}, "404": {$ref: "#/components/responses/Error"}}
  /v1/payment-links/{id}/deactivate:
    post:
      tags: [Payments]
      summary: Stop a payment link (payments:write)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {$ref: "#/components/responses/PaymentLink"}, "404": {$ref: "#/components/responses/Error"}}
  /v1/reports/payments.csv:
    get:
      tags: [Payments]
      summary: Export payments as CSV (payments:read)
      description: Newest first. Cells that a spreadsheet would run as formulas are neutralised.
      parameters:
        - {name: from, in: query, schema: {type: string}, description: "RFC 3339 or YYYY-MM-DD; default 30 days ago"}
        - {name: to, in: query, schema: {type: string}, description: Default now; at most 93 days after from}
        - {name: status, in: query, schema: {type: string, example: "succeeded,refunded"}}
      responses: {"200": {description: CSV file, content: {text/csv: {}}}, "400": {$ref: "#/components/responses/Error"}}
  /v1/reports/statement.csv:
    get:
      tags: [Balance & payouts]
      summary: Balance statement as CSV (balance:read)
      description: The opening balance, then every movement of the available balance (payments, refunds, reserve releases, disputes, payouts) with the balance after it.
      parameters:
        - {name: currency, in: query, schema: {type: string, default: ETB}}
        - {name: from, in: query, schema: {type: string}}
        - {name: to, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string, enum: [live, test]}, description: Dashboard users only}
      responses: {"200": {description: CSV file, content: {text/csv: {}}}, "400": {$ref: "#/components/responses/Error"}}
  /v1/disputes:
    get:
      tags: [Disputes]
      summary: Your disputes (chargebacks), e.g. ?status=needs_response (disputes:read)
      parameters: [{name: status, in: query, schema: {type: string, enum: [needs_response, under_review, won, lost]}}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Disputes}}
  /v1/disputes/{id}:
    get:
      tags: [Disputes]
      summary: A dispute, its evidence and history (disputes:read)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Dispute, content: {application/json: {schema: {$ref: "#/components/schemas/Dispute"}}}}, "404": {$ref: "#/components/responses/Error"}}
  /v1/disputes/{id}/evidence:
    post:
      tags: [Disputes]
      summary: Add evidence before the deadline (disputes:write)
      description: Text and up to 5 files (PDF, JPEG, PNG; 5 MB each), e.g. delivery proof, receipt, chat with the customer. Can be repeated until you submit.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            example: {"text": "Delivered on 2 Nov, signed by the customer."}
            schema: {type: object, properties: {text: {type: string}, files: {type: array, items: {type: string, format: binary}}}}
      responses: {"200": {description: Updated}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/disputes/{id}/submit:
    post:
      tags: [Disputes]
      summary: Send your evidence for review (disputes:write)
      description: Without evidence by `evidence_due_by` the dispute is lost automatically.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Under review}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/disputes/{id}/accept:
    post:
      tags: [Disputes]
      summary: Do not contest; the disputed amount goes back to the cardholder (disputes:write)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Lost}, "409": {$ref: "#/components/responses/Error"}}
  /v1/disputes/{id}/files/{fileId}:
    get:
      tags: [Disputes]
      summary: Download one of your evidence files (disputes:read)
      parameters: [{$ref: "#/components/parameters/Id"}, {name: fileId, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: The file}, "404": {$ref: "#/components/responses/Error"}}
  /v1/payouts:
    post:
      tags: [Balance & payouts]
      summary: Request a payout to your bank account (payouts:write, logged-in users only)
      description: The funds are held at once; you can never request more than `available`.
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            example: {"amount": 100000, "currency": "ETB", "environment": "live", "description": "October settlement", "bank_account": {"bank_name": "Commercial Bank of Ethiopia", "account_number": "1000123456789", "account_name": "Abebe Coffee PLC"}}
            schema:
              type: object
              required: [amount, currency, bank_account]
              properties:
                amount: {type: integer, format: int64, minimum: 10000}
                currency: {type: string, example: ETB}
                environment: {type: string, enum: [live, test], default: live}
                description: {type: string}
                bank_account:
                  type: object
                  required: [bank_name, account_number, account_name]
                  properties:
                    bank_name: {type: string, example: Commercial Bank of Ethiopia}
                    account_number: {type: string, example: "1000123456789"}
                    account_name: {type: string, example: Abebe Coffee PLC}
      responses:
        "201": {description: Requested, content: {application/json: {schema: {$ref: "#/components/schemas/Payout"}}}}
        "422": {$ref: "#/components/responses/Error"}
    get:
      tags: [Balance & payouts]
      summary: List your payouts (payouts:read)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [reserving, requested, paid, failed, rejected]}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/StartingAfter"}
      responses:
        "200": {description: One page, content: {application/json: {schema: {$ref: "#/components/schemas/PayoutPage"}}}}
  /v1/payouts/{id}:
    get:
      tags: [Balance & payouts]
      summary: Get a payout (payouts:read)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Payout, content: {application/json: {schema: {$ref: "#/components/schemas/Payout"}}}}

  # ---------------- Webhooks ----------------
  /v1/webhook-endpoints:
    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint (webhooks:write)
      description: The signing `secret` is returned once.
      requestBody:
        required: true
        content:
          application/json:
            example: {"url": "https://abebecoffee.et/paygate/webhook", "events": ["payment.succeeded", "payment.failed", "refund.succeeded"]}
            schema:
              type: object
              required: [url, events]
              properties:
                url: {type: string, example: "https://shop.example.com/paygate/webhook"}
                events: {type: array, items: {type: string}, example: ["*"]}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/WebhookEndpointWithSecret"}}}}
    get:
      tags: [Webhooks]
      summary: List endpoints (webhooks:write)
      responses:
        "200": {description: Endpoints, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/WebhookEndpoint"}}}}}}}
  /v1/webhook-endpoints/{id}:
    delete:
      tags: [Webhooks]
      summary: Disable an endpoint (webhooks:write)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Disabled}}
  /v1/webhook-endpoints/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      summary: Replace the signing secret, shown once (webhooks:write)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: New secret, content: {application/json: {schema: {$ref: "#/components/schemas/WebhookEndpointWithSecret"}}}}
  /v1/webhook-deliveries:
    get:
      tags: [Webhooks]
      summary: Recent deliveries and their status (webhooks:write)
      parameters: [{$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Deliveries}}
  /v1/webhook-deliveries/{id}/retry:
    post:
      tags: [Webhooks]
      summary: Send a failed delivery again now (webhooks:write)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "202": {description: Queued}
        "404": {$ref: "#/components/responses/Error"}

  # ---------------- API keys ----------------
  /v1/api-keys:
    post:
      tags: [API keys]
      summary: Create an API key (apikeys:manage, logged-in users only)
      description: The `secret` is shown once. Scopes can only be permissions you hold. Test keys work at once; **live keys need an approved business verification (KYC)** (`403 kyc_required`).
      requestBody:
        required: true
        content:
          application/json:
            example: {"name": "Production server", "environment": "test", "scopes": ["payments:read", "payments:write", "refunds:write", "balance:read"], "expires_in_days": 365}
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: {type: string}
                environment: {type: string, enum: [test, live], default: test}
                scopes: {type: array, items: {type: string}, example: [payments:read, payments:write, refunds:write, balance:read]}
                expires_in_days: {type: integer}
      responses:
        "201": {description: Key with its secret (shown once), content: {application/json: {schema: {$ref: "#/components/schemas/APIKeyWithSecret"}}}}
        "403": {$ref: "#/components/responses/Error"}
    get:
      tags: [API keys]
      summary: List keys, without secrets (apikeys:manage)
      responses:
        "200": {description: Keys, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/APIKey"}}}}}}}
  /v1/api-keys/{id}:
    delete:
      tags: [API keys]
      summary: Revoke a key (apikeys:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Revoked}}
  /v1/api-keys/{id}/roll:
    post:
      tags: [API keys]
      summary: Replace a key; the old one works for grace_hours (apikeys:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        content: {application/json: {example: {"grace_hours": 24, "expires_in_days": 365}, schema: {type: object, properties: {grace_hours: {type: integer, default: 24}, expires_in_days: {type: integer}}}}}
      responses:
        "201": {description: New key with its secret, content: {application/json: {schema: {$ref: "#/components/schemas/APIKeyWithSecret"}}}}

  # ---------------- Team & roles (merchant) ----------------
  /v1/team/members:
    post:
      tags: [Team & roles]
      summary: Add a team member with roles (team:manage)
      requestBody: {$ref: "#/components/requestBodies/CreateUser"}
      responses:
        "201": {description: User, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    get:
      tags: [Team & roles]
      summary: List team members (team:manage)
      responses: {"200": {$ref: "#/components/responses/Users"}}
  /v1/team/members/{id}:
    delete:
      tags: [Team & roles]
      summary: Disable a team member, signed out everywhere (team:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Disabled}, "403": {$ref: "#/components/responses/Error"}}
  /v1/team/members/{id}/roles:
    post:
      tags: [Team & roles]
      summary: Assign a role (team:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {$ref: "#/components/requestBodies/AssignRole"}
      responses: {"200": {description: User, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/team/members/{id}/roles/{roleId}:
    delete:
      tags: [Team & roles]
      summary: Remove a role (team:manage)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/RoleId"}]
      responses: {"200": {description: User, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}}
  /v1/permissions:
    get:
      tags: [Team & roles]
      summary: Permissions a merchant role can contain (roles:read)
      responses: {"200": {$ref: "#/components/responses/Permissions"}}
  /v1/roles:
    get:
      tags: [Team & roles]
      summary: Built-in and your custom roles (roles:read)
      responses: {"200": {$ref: "#/components/responses/Roles"}}
    post:
      tags: [Team & roles]
      summary: Create a custom role from permissions (roles:manage)
      requestBody: {$ref: "#/components/requestBodies/CreateRole"}
      responses: {"201": {$ref: "#/components/responses/Role"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/roles/{id}:
    get:
      tags: [Team & roles]
      summary: Get a role (roles:read)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {$ref: "#/components/responses/Role"}}
    patch:
      tags: [Team & roles]
      summary: Rename / describe a custom role (roles:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {$ref: "#/components/requestBodies/UpdateRole"}
      responses: {"200": {$ref: "#/components/responses/Role"}}
    delete:
      tags: [Team & roles]
      summary: Delete a custom role that nobody holds (roles:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Deleted}, "409": {$ref: "#/components/responses/Error"}}
  /v1/roles/{id}/permissions:
    post:
      tags: [Team & roles]
      summary: Add permissions to a role (roles:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {$ref: "#/components/requestBodies/Permissions"}
      responses: {"200": {$ref: "#/components/responses/Role"}}
  /v1/roles/{id}/permissions/{code}:
    delete:
      tags: [Team & roles]
      summary: Remove a permission from a role; holders' tokens become stale at once (roles:manage)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Code"}]
      responses: {"200": {$ref: "#/components/responses/Role"}}
  /v1/audit-log:
    get:
      tags: [Team & roles]
      summary: Role, team and account changes (roles:read)
      responses: {"200": {$ref: "#/components/responses/AuditLog"}}

  # ---------------- KYC (merchant) ----------------
  /v1/kyc:
    get:
      tags: [KYC]
      summary: "Your business verification: status, details, documents, what is missing (kyc:read)"
      responses:
        "200": {$ref: "#/components/responses/KYC"}
  /v1/kyc/profile:
    put:
      tags: [KYC]
      summary: Save business and owner details (kyc:write; while not submitted)
      description: |
        Can be saved incomplete; completeness is checked on submit. The owner's personal data is stored encrypted.
        With `owner.id_type: fayda` the owner is verified through Fayda (POST /v1/kyc/fayda/start) and the owner
        fields are filled in and locked from Fayda; with passport / residence_permit, fill in the owner and upload `owner_id`.
      requestBody:
        required: true
        content:
          application/json:
            example: {"business_type": "plc", "legal_name": "Abebe Coffee PLC", "trade_name": "Abebe Coffee", "registration_number": "MT/AA/2/0012345/2016", "tin": "0012345678", "trade_license_number": "AA/14/123/2024", "trade_license_expiry": "2027-07-07", "vat_registered": true, "vat_number": "1234567", "applicant_role": "general_manager", "foreign_owned": false, "regulated_sector": false, "industry": "Coffee retail", "website": "https://abebecoffee.et", "description": "Specialty coffee shop and online store", "expected_monthly_volume_etb": 500000, "address": {"region": "Addis Ababa", "city": "Addis Ababa", "sub_city": "Bole", "woreda": "03", "house_number": "1234"}, "owner": {"id_type": "fayda"}}
            schema: {$ref: "#/components/schemas/KYCProfile"}
      responses:
        "200": {$ref: "#/components/responses/KYC"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/kyc/documents:
    post:
      tags: [KYC]
      summary: Upload a document (kyc:write) — PDF, JPEG or PNG, max 5 MB
      description: |
        `required_documents` in GET /v1/kyc lists what this business must provide (Ethiopian requirements):

        | Document | Who |
        |---|---|
        | trade_license (valid, not expired) | all businesses (NGOs: registration_certificate) |
        | commercial_registration | all businesses except NGOs |
        | tin_certificate | everyone |
        | memorandum_of_association, shareholders_list | PLC, share company, partnership |
        | vat_certificate | VAT-registered |
        | business_address_proof (lease or title deed) | everyone |
        | bank_account_proof (letter or statement) | everyone |
        | owner_id | owner not verified with Fayda |
        | power_of_attorney | applicant is an authorized representative |
        | investment_permit | foreign-owned |
        | certificate_of_competence | regulated sectors |

        The file type is checked from its content. Larger than 5 MB: `413 file_too_large`.
        Files go to private object storage; only the object key is stored, links are created when read.
      requestBody:
        required: true
        content:
          multipart/form-data:
            example: {"type": "tin_certificate"}
            schema:
              type: object
              required: [type, file]
              properties:
                type: {type: string, enum: [trade_license, commercial_registration, tin_certificate, vat_certificate, memorandum_of_association, shareholders_list, registration_certificate, business_address_proof, bank_account_proof, owner_id, power_of_attorney, investment_permit, certificate_of_competence, other]}
                file: {type: string, format: binary, description: "PDF, JPEG or PNG; max 5 MB"}
      responses:
        "201":
          description: Uploaded
          content: {application/json: {schema: {$ref: "#/components/schemas/KYCDocument"}}}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
  /v1/kyc/documents/{id}:
    get:
      tags: [KYC]
      summary: Get a short-lived download link for one of your documents (kyc:read)
      description: The link is signed and expires in 5 minutes; ask again for a new one.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/DocumentLink"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [KYC]
      summary: Delete a document while draft or rejected (kyc:write)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Deleted}, "409": {$ref: "#/components/responses/Error"}}
  /v1/kyc/fayda/start:
    post:
      tags: [KYC]
      summary: Verify the business owner with Fayda (national digital ID) (kyc:write)
      description: |
        Open `authorize_url` in the owner's browser. They sign in at Fayda (OTP to their Fayda phone) and consent;
        Fayda returns to `/kyc/fayda/callback` and the browser lands on `<DASHBOARD_URL>/kyc?fayda=verified`
        (or `?fayda=failed&reason=...`). Owner name, birth date, phone and photo then come from Fayda and are locked.
        Single use, valid 10 minutes. `502 fayda_not_configured` when the gateway has no Fayda client.
      responses:
        "200":
          description: Sign-in link
          content:
            application/json:
              schema:
                type: object
                properties: {authorize_url: {type: string, format: uri}, expires_at: {type: string, format: date-time}}
              example: {"authorize_url": "https://esignet.ida.fayda.et/authorize?client_id=...&response_type=code&scope=openid+profile+email+phone&code_challenge=...&code_challenge_method=S256&state=...&nonce=...", "expires_at": "2026-11-02T10:10:00Z"}
        "409": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/kyc/submit:
    post:
      tags: [KYC]
      summary: Send the verification for review (kyc:write)
      description: "`422 kyc_incomplete` lists what is missing. After submitting, nothing can change until staff decide."
      responses:
        "200": {$ref: "#/components/responses/KYC"}
        "422": {$ref: "#/components/responses/Error"}

  # ---------------- Admin: merchants & users ----------------
  /admin/merchants:
    post:
      tags: [Admin - merchants & users]
      summary: Create an approved merchant (merchants:manage)
      requestBody:
        required: true
        content:
          application/json:
            example: {"name": "Abebe Coffee PLC", "email": "finance@abebecoffee.et", "phone": "+251911234567", "website": "https://abebecoffee.et", "fee_bps": 150}
            schema:
              type: object
              required: [name, email]
              properties:
                name: {type: string}
                email: {type: string}
                phone: {type: string}
                website: {type: string}
                fee_bps: {type: integer, default: 150}
      responses: {"201": {description: Merchant, content: {application/json: {schema: {$ref: "#/components/schemas/Merchant"}}}}}
    get:
      tags: [Admin - merchants & users]
      summary: List merchants, e.g. ?status=pending to review signups (merchants:read)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, active, suspended]}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/StartingAfter"}
      responses: {"200": {description: One page of merchants}}
  /admin/merchants/{id}:
    get:
      tags: [Admin - merchants & users]
      summary: Get a merchant (merchants:read)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Merchant, content: {application/json: {schema: {$ref: "#/components/schemas/Merchant"}}}}}
    patch:
      tags: [Admin - merchants & users]
      summary: Change the fee and the settings (limits, risk level, reserve, payout schedule) for future payments (merchants:manage)
      description: |
        `settings` replaces the whole settings object. Limits are per currency (minor units, 0 = none) and are
        enforced when a payment is created (`422 limit_exceeded`). The reserve is a share of the merchant's part
        of each payment held for `reserve_days`. A daily or weekly payout schedule needs the bank account you
        verified (KYC bank_account_proof).
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        content:
          application/json:
            example: {"fee_bps": 120, "settings": {"risk_level": "normal", "limits": {"ETB": {"max_amount": 5000000, "daily_amount": 50000000, "daily_count": 2000}}, "reserve_bps": 500, "reserve_days": 14, "payout": {"schedule": "weekly", "weekday": 1, "currencies": ["ETB"], "min_amount": 100000, "bank": {"bank_name": "Commercial Bank of Ethiopia", "account_number": "1000123456789", "account_name": "Abebe Coffee PLC"}}}}
            schema:
              type: object
              properties:
                fee_bps: {type: integer, minimum: 0, maximum: 10000}
                settings: {$ref: "#/components/schemas/MerchantSettings"}
      responses: {"200": {description: Merchant, content: {application/json: {schema: {$ref: "#/components/schemas/Merchant"}}}}}
  /admin/merchants/{id}/status:
    post:
      tags: [Admin - merchants & users]
      summary: Approve (active), suspend or reject a merchant (merchants:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        content: {application/json: {example: {"status": "active"}, schema: {type: object, required: [status], properties: {status: {type: string, enum: [active, suspended]}}}}}
      responses: {"200": {description: Merchant, content: {application/json: {schema: {$ref: "#/components/schemas/Merchant"}}}}}
  /admin/merchants/{id}/api-keys:
    get:
      tags: [Admin - merchants & users]
      summary: A merchant's API keys, no secrets (merchants:read)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Keys}}
  /admin/merchants/{id}/api-keys/{keyId}:
    delete:
      tags: [Admin - merchants & users]
      summary: Revoke a merchant's key, e.g. reported leak (merchants:manage)
      parameters: [{$ref: "#/components/parameters/Id"}, {name: keyId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"204": {description: Revoked}}
  /admin/users:
    post:
      tags: [Admin - merchants & users]
      summary: Create a staff user or a merchant user (users:manage)
      requestBody: {required: true, content: {application/json: {example: {"email": "selam@paygate.et", "name": "Selam Bekele", "password": "Selam-Str0ng-Pass!", "roles": ["finance"]}, schema: {$ref: "#/components/schemas/CreateUserBody"}}}}
      responses: {"201": {description: User, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}}
    get:
      tags: [Admin - merchants & users]
      summary: List staff (or ?merchant_id=) users (users:manage)
      parameters: [{name: merchant_id, in: query, schema: {type: string, format: uuid}}]
      responses: {"200": {$ref: "#/components/responses/Users"}}
  /admin/users/{id}:
    delete:
      tags: [Admin - merchants & users]
      summary: Disable a user (users:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Disabled}}
  /admin/users/{id}/roles:
    post:
      tags: [Admin - merchants & users]
      summary: Assign a role (users:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {example: {"role": "support"}, schema: {$ref: "#/components/schemas/AssignRoleBody"}}}}
      responses: {"200": {description: User, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}}
  /admin/users/{id}/roles/{roleId}:
    delete:
      tags: [Admin - merchants & users]
      summary: Remove a role (users:manage)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/RoleId"}]
      responses: {"200": {description: User, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}}

  # ---------------- Admin: roles ----------------
  /admin/permissions:
    get:
      tags: [Admin - roles]
      summary: Permissions for platform roles, or ?audience=merchant (roles:read)
      parameters: [{$ref: "#/components/parameters/Audience"}]
      responses: {"200": {$ref: "#/components/responses/Permissions"}}
  /admin/roles:
    get:
      tags: [Admin - roles]
      summary: Platform roles, or ?audience=merchant for the merchant templates (roles:read)
      parameters: [{$ref: "#/components/parameters/Audience"}]
      responses: {"200": {$ref: "#/components/responses/Roles"}}
    post:
      tags: [Admin - roles]
      summary: Create a platform role (or merchant template with audience=merchant) (roles:manage)
      requestBody: {required: true, content: {application/json: {example: {"name": "Auditor", "description": "Read-only access to the books", "permissions": ["ledger:read", "merchants:read"]}, schema: {$ref: "#/components/schemas/CreateRoleBody"}}}}
      responses: {"201": {$ref: "#/components/responses/Role"}}
  /admin/roles/{id}:
    get:
      tags: [Admin - roles]
      summary: Get a role (roles:read)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {$ref: "#/components/responses/Role"}}
    patch:
      tags: [Admin - roles]
      summary: Rename / describe a role (roles:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {example: {"name": "Auditor", "description": "Read-only books and merchants"}, schema: {$ref: "#/components/schemas/UpdateRoleBody"}}}}
      responses: {"200": {$ref: "#/components/responses/Role"}}
    delete:
      tags: [Admin - roles]
      summary: Delete a custom role nobody holds (roles:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Deleted}}
  /admin/roles/{id}/permissions:
    post:
      tags: [Admin - roles]
      summary: Add permissions to a role (roles:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {example: {"permissions": ["reconciliation:run"]}, schema: {$ref: "#/components/schemas/PermissionsBody"}}}}
      responses: {"200": {$ref: "#/components/responses/Role"}}
  /admin/roles/{id}/permissions/{code}:
    delete:
      tags: [Admin - roles]
      summary: Remove a permission from a role (roles:manage)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Code"}]
      responses: {"200": {$ref: "#/components/responses/Role"}}
  /admin/audit-log:
    get:
      tags: [Admin - roles]
      summary: Platform audit log (roles:read)
      responses: {"200": {$ref: "#/components/responses/AuditLog"}}

  # ---------------- Admin: money ----------------
  /admin/payouts:
    get:
      tags: [Admin - money]
      summary: Payouts to process, e.g. ?status=requested (payouts:manage)
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: merchant_id, in: query, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/StartingAfter"}
      responses: {"200": {description: One page, content: {application/json: {schema: {$ref: "#/components/schemas/PayoutPage"}}}}}
  /admin/payouts/{id}:
    get:
      tags: [Admin - money]
      summary: Get a payout (payouts:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Payout, content: {application/json: {schema: {$ref: "#/components/schemas/Payout"}}}}}
  /admin/payouts/{id}/paid:
    post:
      tags: [Admin - money]
      summary: Confirm the bank transfer was sent (payouts:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        content: {application/json: {example: {"bank_reference": "CBE-FT-2026102800123"}, schema: {type: object, required: [bank_reference], properties: {bank_reference: {type: string}}}}}
      responses: {"200": {description: Payout, content: {application/json: {schema: {$ref: "#/components/schemas/Payout"}}}}, "409": {$ref: "#/components/responses/Error"}}
  /admin/payouts/{id}/failed:
    post:
      tags: [Admin - money]
      summary: Transfer failed; release the held funds (payouts:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        content: {application/json: {example: {"reason": "Beneficiary account closed"}, schema: {type: object, required: [reason], properties: {reason: {type: string}}}}}
      responses: {"200": {description: Payout, content: {application/json: {schema: {$ref: "#/components/schemas/Payout"}}}}}
  /admin/ledger/trial-balance:
    get:
      tags: [Admin - money]
      summary: Debits vs credits per currency; must always balance (ledger:read)
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {type: object, properties: {currency: {type: string}, debits: {type: integer}, credits: {type: integer}, balanced: {type: boolean}}}
  /admin/reconciliation/runs:
    post:
      tags: [Admin - money]
      summary: Compare our payments with the providers for a period (reconciliation:run)
      requestBody:
        required: true
        content:
          application/json:
            example: {"from": "2026-10-27T00:00:00Z", "to": "2026-10-28T00:00:00Z"}
            schema:
              type: object
              required: [from, to]
              properties:
                from: {type: string, format: date-time}
                to: {type: string, format: date-time}
                provider: {type: string, description: Only payments routed to this provider}
      description: |
        Checks every payment created in the period three ways: against the provider's live API
        (status and amount), against the ledger (every capture booked once, for its amount), and for
        payments stuck in `processing`. A run also starts automatically every day for the previous
        business day (RECONCILIATION_TIMEZONE, default Africa/Addis_Ababa). When the provider says the
        customer was charged but the payment is not succeeded, the payment is repaired automatically
        (recorded in its history); everything else becomes an open item.
      responses: {"202": {$ref: "#/components/responses/ReconciliationRun"}}
    get:
      tags: [Admin - money]
      summary: Recent reconciliation runs (reconciliation:run)
      parameters: [{$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Runs}}
  /admin/reconciliation/runs/{id}:
    get:
      tags: [Admin - money]
      summary: A run, its summary and the differences found (reconciliation:run)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {$ref: "#/components/responses/ReconciliationRun"}}
  /admin/reconciliation/items:
    get:
      tags: [Admin - money]
      summary: "The work queue: differences, e.g. ?status=open&severity=critical (reconciliation:run)"
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, auto_resolved, resolved, all], default: open}}
        - {name: severity, in: query, schema: {type: string, enum: [critical, high, medium, low]}}
        - {name: issue, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Items, newest first
          content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/ReconciliationItem"}}}}}}
  /admin/reconciliation/items/{id}/resolve:
    post:
      tags: [Admin - money]
      summary: Close a difference after investigating it (reconciliation:resolve, finance)
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            example: {"note": "provider confirmed a partial capture; adjustment raised"}
            schema: {type: object, required: [note], properties: {note: {type: string, minLength: 5}}}
      responses:
        "200": {description: Resolved, content: {application/json: {schema: {$ref: "#/components/schemas/ReconciliationItem"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /admin/reconciliation/settlements:
    post:
      tags: [Admin - money]
      summary: Upload a provider's settlement report for a business day (reconciliation:run)
      description: |
        CSV with a header row. Required columns: `reference` (our payment id, the order id sent to the
        provider), `amount` (major units, `50.00`), `currency`. Optional: `type` (`payment` or `refund`),
        `fee`, `settled_at`. Every bad line is reported with its number and nothing is imported. The same
        file cannot be uploaded twice. Matching finds: wrong amounts, payments the provider settled that we
        did not capture (repaired automatically when the provider confirms), captured payments not
        settled yet (closed automatically when a later report contains them), duplicates, and a bank
        deposit (`deposit_amount`) that differs from the report's net.
      parameters:
        - {name: provider, in: query, required: true, schema: {type: string, example: mpgs}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: deposit_amount, in: query, schema: {type: string, example: "12345.67"}, description: What the bank paid in for this report}
        - {name: deposit_currency, in: query, schema: {type: string, example: ETB}}
        - {name: file_name, in: query, schema: {type: string}}
      requestBody:
        required: true
        content:
          text/csv:
            example: "reference,type,amount,fee,currency,settled_at\n7b9e2c1a-3f4d-4e8a-9b6c-1d2e3f4a5b6c,payment,1500.00,22.50,ETB,2026-10-28\n"
            schema: {type: string}
      responses:
        "202":
          description: Stored; matching runs now (see the run)
          content: {application/json: {schema: {type: object, properties: {settlement: {$ref: "#/components/schemas/Settlement"}, run: {type: object}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
    get:
      tags: [Admin - money]
      summary: Uploaded settlement reports, newest first (reconciliation:run)
      parameters: [{$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Settlements, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Settlement"}}}}}}}}
  /admin/reconciliation/settlements/{id}:
    get:
      tags: [Admin - money]
      summary: One settlement report (reconciliation:run)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Settlement, content: {application/json: {schema: {$ref: "#/components/schemas/Settlement"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /admin/risk/blocklist:
    get:
      tags: [Admin - risk & disputes]
      summary: Blocklist, e.g. ?kind=email (risk:read)
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [email, phone, ip]}}
        - {$ref: "#/components/parameters/Limit"}
      responses: {"200": {description: Entries}}
    post:
      tags: [Admin - risk & disputes]
      summary: Block an email, phone or IP from paying (risk:manage)
      description: Values are normalised (lower-case email, +251 phone, canonical IP). Payments from a blocked customer fail with `422 risk_declined`.
      requestBody:
        required: true
        content:
          application/json:
            example: {"kind": "email", "value": "fraud@example.com", "reason": "3 chargebacks in October"}
            schema: {type: object, required: [kind, value, reason], properties: {kind: {type: string, enum: [email, phone, ip]}, value: {type: string}, reason: {type: string}}}
      responses: {"201": {description: Blocked}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /admin/risk/blocklist/{id}:
    delete:
      tags: [Admin - risk & disputes]
      summary: Remove a blocklist entry (risk:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"204": {description: Removed}, "404": {$ref: "#/components/responses/Error"}}
  /admin/risk/decisions:
    get:
      tags: [Admin - risk & disputes]
      summary: Risk decisions, newest first (risk:read)
      description: |
        Every payment is scored before it reaches a provider. Rules: blocklist (100), 5+ attempts by one customer
        in 10 minutes or 20+ in a day (100), 10+ from one IP in 10 minutes (100), 3+ declines of one customer in an hour
        (60; 5+ = 100, card testing), an amount over 10x the merchant's 30-day average (40), high-risk merchant (20).
        100 blocks. High-risk merchants get half the thresholds.
      parameters:
        - {name: merchant_id, in: query, schema: {type: string}}
        - {name: payment_id, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string, enum: [allow, block]}}
        - {$ref: "#/components/parameters/Limit"}
      responses: {"200": {description: Decisions}}
  /admin/disputes:
    post:
      tags: [Admin - risk & disputes]
      summary: Record a dispute (chargeback) the provider notified (disputes:manage)
      description: The amount (default all that is left of the payment) leaves the merchant's balance at once and is held. The merchant gets a `dispute.opened` webhook.
      requestBody:
        required: true
        content:
          application/json:
            example: {"payment_id": "7b9e2c1a-3f4d-4e8a-9b6c-1d2e3f4a5b6c", "amount": 20000, "reason_code": "product_not_received", "reason": "cardholder says the order never arrived", "provider_case_id": "CB-1001", "evidence_due_by": "2026-11-10T00:00:00Z"}
            schema:
              type: object
              required: [payment_id, reason_code]
              properties:
                payment_id: {type: string}
                amount: {type: integer}
                reason_code: {type: string, enum: [fraudulent, product_not_received, product_unacceptable, duplicate, credit_not_processed, subscription_canceled, general]}
                reason: {type: string}
                provider_case_id: {type: string}
                evidence_due_by: {type: string, format: date-time, description: Default 7 days}
      responses:
        "201": {description: Opened, content: {application/json: {schema: {$ref: "#/components/schemas/Dispute"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    get:
      tags: [Admin - risk & disputes]
      summary: All disputes, e.g. ?status=under_review (disputes:manage)
      parameters: [{name: status, in: query, schema: {type: string}}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Disputes}}
  /admin/disputes/{id}:
    get:
      tags: [Admin - risk & disputes]
      summary: A dispute with its evidence and history (disputes:manage)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Dispute, content: {application/json: {schema: {$ref: "#/components/schemas/Dispute"}}}}, "404": {$ref: "#/components/responses/Error"}}
  /admin/disputes/{id}/files/{fileId}:
    get:
      tags: [Admin - risk & disputes]
      summary: Download an evidence file (disputes:manage)
      parameters: [{$ref: "#/components/parameters/Id"}, {name: fileId, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: The file}, "404": {$ref: "#/components/responses/Error"}}
  /admin/disputes/{id}/close:
    post:
      tags: [Admin - risk & disputes]
      summary: Record the issuer's decision (disputes:manage)
      description: "`won`: the held money goes back to the merchant. `lost`: it goes back to the cardholder and `fee` (the provider's chargeback fee) is charged to the merchant."
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            example: {"outcome": "won", "note": "issuer accepted the delivery proof"}
            schema: {type: object, required: [outcome], properties: {outcome: {type: string, enum: [won, lost]}, fee: {type: integer}, note: {type: string}}}
      responses: {"200": {description: Closed, content: {application/json: {schema: {$ref: "#/components/schemas/Dispute"}}}}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /admin/payments/{id}:
    get:
      tags: [Admin - money]
      summary: Any merchant's payment (payments:read_all)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Payment, content: {application/json: {schema: {$ref: "#/components/schemas/Payment"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /admin/payments/{id}/events:
    get:
      tags: [Admin - money]
      summary: Any payment's full history (payments:read_all)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/PaymentEvents"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/providers:
    get:
      tags: [Admin - money]
      summary: Provider adapters, live routing and health (providers:read)
      responses: {"200": {description: Providers and routes}}

  # ---------------- Admin: KYC review ----------------
  /admin/kyc:
    get:
      tags: [Admin - KYC]
      summary: Review queue, e.g. ?status=submitted, oldest first (kyc:review)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [draft, submitted, approved, rejected]}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/StartingAfter"}
      responses: {"200": {description: One page of applications}}
  /admin/kyc/{merchantId}:
    get:
      tags: [Admin - KYC]
      summary: Full application with documents and history (kyc:review)
      parameters: [{$ref: "#/components/parameters/MerchantId"}]
      responses: {"200": {$ref: "#/components/responses/KYC"}, "404": {$ref: "#/components/responses/Error"}}
  /admin/kyc/{merchantId}/documents/{id}:
    get:
      tags: [Admin - KYC]
      summary: Get a short-lived download link for a document (kyc:review; every view is recorded)
      parameters: [{$ref: "#/components/parameters/MerchantId"}, {$ref: "#/components/parameters/Id"}]
      responses: {"200": {$ref: "#/components/responses/DocumentLink"}, "404": {$ref: "#/components/responses/Error"}}
  /admin/kyc/{merchantId}/approve:
    post:
      tags: [Admin - KYC]
      summary: Approve; the merchant becomes active (live payments, live keys, payouts) (kyc:review)
      parameters: [{$ref: "#/components/parameters/MerchantId"}]
      requestBody:
        content: {application/json: {example: {"note": "Documents verified against ERCA and the trade registry"}, schema: {type: object, properties: {note: {type: string}}}}}
      responses: {"200": {$ref: "#/components/responses/KYC"}, "409": {$ref: "#/components/responses/Error"}}
  /admin/kyc/{merchantId}/reject:
    post:
      tags: [Admin - KYC]
      summary: Reject with a reason shown to the merchant; they fix and resubmit (kyc:review)
      parameters: [{$ref: "#/components/parameters/MerchantId"}]
      requestBody:
        required: true
        content: {application/json: {example: {"reason": "The TIN certificate is unreadable; upload a clear scan"}, schema: {type: object, required: [reason], properties: {reason: {type: string}}}}}
      responses: {"200": {$ref: "#/components/responses/KYC"}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}

  # ---------------- Hosted pages & provider callbacks ----------------
  /kyc/fayda/callback:
    get:
      tags: [KYC]
      summary: Fayda returns the owner here (browser redirect; not called by integrations)
      security: []
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses: {"303": {description: "Redirect to <DASHBOARD_URL>/kyc?fayda=verified | failed&reason=..."}}
  /kyc/files/{token}:
    get:
      tags: [KYC]
      summary: Download a document through a signed link (local storage only; with MinIO links point at MinIO)
      security: []
      parameters: [{name: token, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: The file, content: {application/pdf: {}, image/jpeg: {}, image/png: {}}}
        "404": {$ref: "#/components/responses/Error"}
  /l/{id}:
    get:
      tags: [Hosted pages & providers]
      summary: A payment link; opens a payment and redirects to the checkout page
      security: []
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"303": {description: "To /pay/{payment id}"}, "404": {description: Unknown link}, "410": {description: Paid, expired or deactivated}}
  /pay/{id}:
    get:
      tags: [Hosted pages & providers]
      summary: Hosted checkout page (customer's browser)
      description: Shown when a payment is created without payment_method. The customer picks a method.
      security: []
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: HTML page}}
    post:
      tags: [Hosted pages & providers]
      summary: Customer picks a method; redirected to the provider
      security: []
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            example: {"method": "telebirr"}
            schema: {type: object, properties: {method: {type: string, enum: [telebirr, cbe_birr, mpesa, card, bank_transfer]}}}
      responses: {"303": {description: Redirect to the provider's checkout}}
  /providers/{provider}/callback:
    post:
      tags: [Hosted pages & providers]
      summary: Provider notification (authenticated per provider, then verified with the provider)
      security: []
      parameters: [{name: provider, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Received}}
    get:
      tags: [Hosted pages & providers]
      summary: Provider redirect-style notification
      security: []
      parameters: [{name: provider, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Received}}
  /providers/{provider}/pay/{txRef}:
    get:
      tags: [Hosted pages & providers]
      summary: Card payment page (Mastercard Hosted Checkout); the checkout_url of a card payment
      description: |
        Loads Mastercard's checkout script for the session and sends the customer to the card form hosted by
        Mastercard (card number, 3-D Secure). Card data never reaches this gateway.
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, example: mpgs}}
        - {name: txRef, in: path, required: true, schema: {type: string}}
        - {name: session, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: HTML page}, "404": {$ref: "#/components/responses/Error"}}
  /providers/{provider}/return/{txRef}:
    get:
      tags: [Hosted pages & providers]
      summary: The customer returns from the provider's page; status verified with the provider, then redirect to return_url
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, example: mpgs}}
        - {name: txRef, in: path, required: true, schema: {type: string}}
      responses: {"303": {description: "Redirect to the payment's return_url (or /pay/{id})"}, "404": {$ref: "#/components/responses/Error"}}
  /providers/mock/checkout/{txRef}:
    get:
      tags: [Hosted pages & providers]
      summary: Sandbox provider page (test mode)
      security: []
      parameters: [{name: txRef, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: HTML page}}
    post:
      tags: [Hosted pages & providers]
      summary: Sandbox pay / decline (test mode)
      security: []
      parameters: [{name: txRef, in: path, required: true, schema: {type: string}}]
      requestBody:
        content: {application/x-www-form-urlencoded: {example: {"result": "success"}, schema: {type: object, properties: {result: {type: string, enum: [success, failed]}}}}}
      responses: {"200": {description: Result page}, "303": {description: Back to the merchant's return_url}}

  # ---------------- System ----------------
  /:
    get:
      tags: [System]
      summary: Redirects to the API documentation (/docs)
      security: []
      responses: {"302": {description: Redirect to /docs}}
  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics (with METRICS_TOKEN set, send it as a Bearer token)
      description: |
        Traffic (`paygate_http_requests_total`, latency histogram by route), payments (created, final status and
        reason, open and stuck), provider calls (outcome ok / unavailable / unknown / error, latency), risk outcomes,
        outbox backlog per module, webhook deliveries waiting or failed, open reconciliation items by severity, open
        disputes, and `paygate_ledger_unbalanced` (1 = the books do not balance: page someone).
      security: []
      responses: {"200": {description: Metrics in the Prometheus text format, content: {text/plain: {}}}, "401": {description: Missing or wrong token}}
  /healthz:
    get:
      tags: [System]
      summary: Liveness, modules and bus routes of this process
      security: []
      responses: {"200": {description: OK}}
  /openapi.yaml:
    get:
      tags: [System]
      summary: This document
      security: []
      responses: {"200": {description: OpenAPI 3 YAML}}
  /swagger:
    get:
      tags: [System]
      summary: Swagger UI (try requests from the browser)
      security: []
      responses: {"200": {description: HTML page}}
  /docs:
    get:
      tags: [System]
      summary: Readable API reference
      security: []
      responses: {"200": {description: HTML page}}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "`sk_test_...` / `sk_live_...` API key for servers, or an access token from login."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 100}
      description: Unique per operation (e.g. order id + attempt). Reuse it when retrying.
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}, example: "3f6c2a9e-8d41-4b7e-a0c5-91e2d7f4b8a1"}
    MerchantId: {name: merchantId, in: path, required: true, schema: {type: string, format: uuid}, example: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"}
    RoleId: {name: roleId, in: path, required: true, schema: {type: string, format: uuid}, example: "9a1d3c5e-7b2f-4e6a-8c0d-2f4b6d8e0a1c"}
    Code: {name: code, in: path, required: true, schema: {type: string, example: "refunds:write"}}
    Limit: {name: limit, in: query, schema: {type: integer, default: 20, maximum: 100}}
    StartingAfter: {name: starting_after, in: query, schema: {type: string}, description: next_cursor from the previous page}
    Audience: {name: audience, in: query, schema: {type: string, enum: [platform, merchant], default: platform}}
  requestBodies:
    CreateUser:
      required: true
      content: {application/json: {example: {"email": "hana@abebecoffee.et", "name": "Hana Tesfaye", "password": "Hana-Str0ng-Pass!", "roles": ["developer"]}, schema: {$ref: "#/components/schemas/CreateUserBody"}}}
    AssignRole:
      required: true
      content: {application/json: {example: {"role": "analyst"}, schema: {$ref: "#/components/schemas/AssignRoleBody"}}}
    CreateRole:
      required: true
      content: {application/json: {example: {"name": "Refund Desk", "description": "Handles customer refunds", "permissions": ["payments:read", "refunds:write"]}, schema: {$ref: "#/components/schemas/CreateRoleBody"}}}
    UpdateRole:
      content: {application/json: {example: {"name": "Refund Desk", "description": "Handles customer refunds and disputes"}, schema: {$ref: "#/components/schemas/UpdateRoleBody"}}}
    Permissions:
      required: true
      content: {application/json: {example: {"permissions": ["balance:read"]}, schema: {$ref: "#/components/schemas/PermissionsBody"}}}
  responses:
    PaymentLink:
      description: Payment link
      content:
        application/json:
          example: {"id": "pl_7q3k2m9x4v8p1r6t5w0y2z4b6d", "url": "https://api.paygate.example/l/pl_7q3k2m9x4v8p1r6t5w0y2z4b6d", "environment": "live", "amount": 250000, "currency": "ETB", "description": "Invoice 77: 5 bags of coffee", "reference": "INV-77", "single_use": true, "active": true, "expires_at": "2026-12-01T00:00:00Z", "paid_count": 0, "created_at": "2026-11-04T09:00:00Z"}
          schema:
            type: object
            properties:
              id: {type: string}
              url: {type: string}
              environment: {type: string}
              amount: {type: integer}
              currency: {type: string}
              description: {type: string}
              reference: {type: string}
              single_use: {type: boolean}
              active: {type: boolean}
              expires_at: {type: string, format: date-time}
              paid_count: {type: integer}
              created_at: {type: string, format: date-time}
    DocumentLink:
      description: A download link built now from the stored object key; expires in 5 minutes
      content:
        application/json:
          schema:
            type: object
            properties:
              url: {type: string, format: uri}
              expires_at: {type: string, format: date-time}
              file_name: {type: string}
              sha256: {type: string}
          example: {"url": "https://files.paygate.example/kyc-documents/kyc/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d/f1e2d3c4-b5a6-4978-8a9b-0c1d2e3f4a5b.pdf?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=300&X-Amz-Signature=...", "expires_at": "2026-11-02T10:05:00Z", "file_name": "tin.pdf", "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"}
    KYC:
      description: Verification
      content: {application/json: {schema: {$ref: "#/components/schemas/KYCApplication"}}}
    Error:
      description: Error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Tokens:
      description: Logged in
      content: {application/json: {schema: {$ref: "#/components/schemas/Tokens"}}}
    Users:
      description: Users
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/User"}}}}}}
    Role:
      description: Role
      content: {application/json: {schema: {$ref: "#/components/schemas/Role"}}}
    Roles:
      description: Roles
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Role"}}}}}}
    Permissions:
      description: Permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: {type: object, properties: {code: {type: string}, description: {type: string}, module: {type: string}, audience: {type: string}, api_key: {type: boolean}}}
    AuditLog:
      description: Newest first
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: {type: object, properties: {id: {type: string}, actor_id: {type: string}, action: {type: string}, target_type: {type: string}, target_id: {type: string}, details: {type: object}, created_at: {type: string, format: date-time}}}
    ReconciliationRun:
      description: Run
      content:
        application/json:
          schema:
            type: object
            properties:
              id: {type: string}
              kind: {type: string, enum: [manual, daily, settlement]}
              provider: {type: string}
              settlement_id: {type: string}
              period_start: {type: string, format: date-time}
              period_end: {type: string, format: date-time}
              status: {type: string, enum: [queued, running, completed, failed]}
              checked: {type: integer}
              mismatched: {type: integer}
              summary:
                type: object
                description: "Totals per currency (captured / settled: count, amount, fees, refunded, net), new issues by type, critical count, auto_resolved, carried_over_closed, deposit check"
              items: {type: array, items: {$ref: "#/components/schemas/ReconciliationItem"}}
          example: {"id": "3c1d2e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", "kind": "daily", "period_start": "2026-10-27T21:00:00Z", "period_end": "2026-10-28T21:00:00Z", "status": "completed", "checked": 1250, "mismatched": 2, "summary": {"by_status": {"succeeded": 1180, "failed": 52, "expired": 18}, "captured": {"ETB": {"count": 1180, "amount": 98500000, "fees": 1477500, "refunded": 120000, "net": 96902500}}, "issues": {"status_mismatch": 1, "ledger_missing": 1}, "critical": 1, "auto_resolved": 1, "carried_over_closed": 0}, "items": [{"id": 41, "run_id": "3c1d2e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", "payment_id": "7b9e2c1a-3f4d-4e8a-9b6c-1d2e3f4a5b6c", "reference": "7b9e2c1a-3f4d-4e8a-9b6c-1d2e3f4a5b6c", "provider": "telebirr", "issue": "status_mismatch", "severity": "critical", "expected": "failed", "actual": "succeeded", "status": "auto_resolved", "resolution": "repaired: the provider confirmed the capture and the payment is now succeeded", "resolved_by": "reconciliation", "created_at": "2026-10-29T01:00:02Z"}]}
    PaymentEvents:
      description: History, oldest first
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    from_status: {type: string}
                    to_status: {type: string}
                    source: {type: string, enum: [merchant_api, customer, provider, status_check, expiry, refund, reconciliation, system, migration]}
                    reason: {type: string}
                    provider: {type: string}
                    details: {type: object}
                    created_at: {type: string, format: date-time}
          example: {"data": [{"id": 1, "from_status": "", "to_status": "pending", "source": "merchant_api", "created_at": "2026-10-28T09:30:00Z"}, {"id": 2, "from_status": "pending", "to_status": "processing", "source": "merchant_api", "reason": "checkout opened", "provider": "telebirr", "created_at": "2026-10-28T09:30:01Z"}, {"id": 3, "from_status": "processing", "to_status": "succeeded", "source": "provider", "provider": "telebirr", "details": {"provider_status": "succeeded", "amount": 150000, "currency": "ETB"}, "created_at": "2026-10-28T09:31:12Z"}]}
  schemas:
    MerchantSettings:
      type: object
      properties:
        risk_level: {type: string, enum: [low, normal, high], default: normal}
        limits:
          type: object
          description: Per currency (ETB, USD), minor units; 0 or missing = no limit
          additionalProperties:
            type: object
            properties: {max_amount: {type: integer}, daily_amount: {type: integer}, daily_count: {type: integer}}
        reserve_bps: {type: integer, minimum: 0, maximum: 5000, description: "Share of the merchant's part held, 1000 = 10%"}
        reserve_days: {type: integer, minimum: 0, maximum: 180}
        payout:
          type: object
          properties:
            schedule: {type: string, enum: [manual, daily, weekly], default: manual}
            weekday: {type: integer, minimum: 1, maximum: 7, description: "weekly: 1 = Monday"}
            currencies: {type: array, items: {type: string}, default: [ETB]}
            min_amount: {type: integer}
            bank: {type: object, properties: {bank_name: {type: string}, account_number: {type: string}, account_name: {type: string}}}
    Dispute:
      type: object
      properties:
        id: {type: string}
        payment_id: {type: string}
        amount: {type: integer}
        currency: {type: string}
        status: {type: string, enum: [needs_response, under_review, won, lost]}
        reason_code: {type: string}
        reason: {type: string}
        provider_case_id: {type: string}
        evidence_due_by: {type: string, format: date-time}
        evidence_text: {type: string}
        files: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}, content_type: {type: string}, size: {type: integer}, sha256: {type: string}}}}
        outcome: {type: string, enum: [won, lost]}
        fee: {type: integer}
        history: {type: array, items: {type: object, properties: {action: {type: string}, actor: {type: string}, note: {type: string}, created_at: {type: string, format: date-time}}}}
      example: {"id": "1d2e3f4a-5b6c-4d7e-8f9a-0b1c2d3e4f5a", "payment_id": "7b9e2c1a-3f4d-4e8a-9b6c-1d2e3f4a5b6c", "amount": 20000, "currency": "USD", "status": "needs_response", "reason_code": "product_not_received", "evidence_due_by": "2026-11-10T00:00:00Z", "files": []}
    ReconciliationItem:
      type: object
      properties:
        id: {type: integer}
        run_id: {type: string}
        payment_id: {type: string}
        reference: {type: string}
        provider: {type: string}
        issue: {type: string, enum: [status_mismatch, amount_mismatch, missing_at_provider, provider_error, stuck_processing, ledger_missing, ledger_amount_mismatch, settlement_missing, settlement_unknown, settlement_amount_mismatch, settlement_duplicate, deposit_mismatch]}
        severity: {type: string, enum: [critical, high, medium, low]}
        expected: {type: string}
        actual: {type: string}
        status: {type: string, enum: [open, auto_resolved, resolved]}
        resolution: {type: string}
        resolved_by: {type: string}
        resolved_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    Settlement:
      type: object
      properties:
        id: {type: string}
        provider: {type: string}
        settlement_date: {type: string, format: date}
        file_name: {type: string}
        sha256: {type: string}
        line_count: {type: integer}
        deposit_amount: {type: integer}
        deposit_currency: {type: string}
        uploaded_by: {type: string}
        created_at: {type: string, format: date-time}
    Error:
      type: object
      example: {"error": {"kind": "invalid", "code": "invalid_amount", "message": "amount must be a positive integer in minor units"}}
      properties:
        error:
          type: object
          properties:
            kind: {type: string, example: invalid}
            code: {type: string, example: invalid_amount}
            message: {type: string}
    Tokens:
      type: object
      example: {"access_token": "eyJhbGciOiJFZERTQSIsImtpZCI6IjM5NWYzOTJkNjU1OGI3YzUiLCJ0eXAiOiJKV1QifQ.eyJzdWIiOiI1ZDJjOGUxYSJ9.c2lnbmF0dXJl", "token_type": "Bearer", "expires_in": 300, "refresh_token": "rt_8Qm2Zr7LkP0sXc9VbN4tHw1yJe6aDf3gUo5iKq", "refresh_expires_at": "2026-11-04T09:15:00Z", "user": {"id": "5d2c8e1a-4b6f-4c3e-9a7d-2e1f0b9c8d7a", "email": "abebe@abebecoffee.et", "name": "Abebe Kebede", "merchant_id": "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d", "role": "owner", "roles": [{"id": "6e46d4ec-8974-50eb-925b-e42e37cc9cc9", "name": "owner"}], "permissions": ["apikeys:manage", "balance:read", "payments:read", "payments:write", "refunds:write", "roles:manage", "roles:read", "team:manage", "webhooks:write", "payouts:read", "payouts:write"], "status": "active", "last_login_at": "2026-10-28T09:15:00Z", "created_at": "2026-10-01T08:00:00Z"}}
      properties:
        access_token: {type: string, description: "JWT (EdDSA), 5 minutes. Carries your roles and permissions."}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 300}
        refresh_token: {type: string, example: rt_..., description: "7 days, single use (rotated)"}
        refresh_expires_at: {type: string, format: date-time}
        user: {$ref: "#/components/schemas/User"}
        mfa_required: {type: boolean, description: "True when an authenticator code is needed (no tokens yet)"}
        mfa_token: {type: string, description: "Send to POST /auth/login/mfa with the code"}
        mfa_expires_in: {type: integer, example: 300}
    User:
      type: object
      example: {"id": "5d2c8e1a-4b6f-4c3e-9a7d-2e1f0b9c8d7a", "email": "abebe@abebecoffee.et", "name": "Abebe Kebede", "merchant_id": "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d", "role": "owner", "roles": [{"id": "6e46d4ec-8974-50eb-925b-e42e37cc9cc9", "name": "owner"}], "permissions": ["apikeys:manage", "balance:read", "payments:read", "payments:write", "refunds:write", "roles:manage", "roles:read", "team:manage", "webhooks:write", "payouts:read", "payouts:write"], "status": "active", "last_login_at": "2026-10-28T09:15:00Z", "created_at": "2026-10-01T08:00:00Z"}
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        name: {type: string}
        merchant_id: {type: string, description: Empty for platform staff}
        role: {type: string, description: Primary role name}
        roles: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}}}}
        permissions: {type: array, items: {type: string}}
        status: {type: string, enum: [active, disabled]}
        last_login_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    Role:
      type: object
      example: {"id": "0c9f6a3e-1d2b-4e5f-8a7c-9b0d1e2f3a4b", "name": "Refund Desk", "description": "Handles customer refunds", "audience": "merchant", "merchant_id": "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d", "built_in": false, "locked": false, "permissions": ["payments:read", "refunds:write"]}
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        audience: {type: string, enum: [platform, merchant]}
        merchant_id: {type: string}
        built_in: {type: boolean}
        locked: {type: boolean, description: Holds every permission; cannot be edited}
        permissions: {type: array, items: {type: string}}
    Merchant:
      type: object
      example: {"id": "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d", "name": "Abebe Coffee PLC", "email": "finance@abebecoffee.et", "phone": "+251911234567", "website": "https://abebecoffee.et", "status": "active", "fee_bps": 150, "approved_at": "2026-10-02T10:00:00Z", "created_at": "2026-10-01T08:00:00Z"}
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        website: {type: string}
        status: {type: string, enum: [pending, active, suspended]}
        kyc_status: {type: string, enum: [not_started, draft, submitted, approved, rejected, waived]}
        fee_bps: {type: integer, description: "Platform fee in basis points (150 = 1.5%)"}
        approved_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    APIKey:
      type: object
      example: {"id": "b7e1c2d3-4f5a-4b6c-8d7e-9f0a1b2c3d4e", "name": "Production server", "prefix": "sk_test_3kTq", "last4": "9fQ2", "environment": "test", "scopes": ["payments:read", "payments:write", "refunds:write", "balance:read"], "status": "active", "expires_at": "2027-10-28T09:15:00Z", "last_used_at": "2026-10-28T09:20:00Z", "created_at": "2026-10-28T09:15:00Z"}
      properties:
        id: {type: string}
        name: {type: string}
        prefix: {type: string, example: sk_live_3kTq}
        last4: {type: string}
        environment: {type: string, enum: [live, test]}
        scopes: {type: array, items: {type: string}}
        status: {type: string, enum: [active, expired, revoked]}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    APIKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - {type: object, properties: {secret: {type: string, description: Shown once}, warning: {type: string}}}
    WebhookEndpoint:
      type: object
      example: {"id": "c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f", "url": "https://abebecoffee.et/paygate/webhook", "events": ["payment.succeeded", "payment.failed", "refund.succeeded"], "active": true, "created_at": "2026-10-28T09:30:00Z"}
      properties:
        id: {type: string}
        url: {type: string}
        events: {type: array, items: {type: string}}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
    WebhookEndpointWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - {type: object, properties: {secret: {type: string, example: whsec_...}, warning: {type: string}}}
    CreatePayment:
      type: object
      required: [amount, currency, reference]
      properties:
        amount: {type: integer, format: int64, example: 150000}
        currency: {type: string, enum: [ETB, USD]}
        payment_method:
          type: string
          enum: [telebirr, cbe_birr, mpesa, card, bank_transfer]
          description: Omit to let the customer choose on the hosted page. See GET /v1/payment-methods.
        reference: {type: string, maxLength: 100, description: Your order id}
        description: {type: string, maxLength: 255}
        metadata:
          type: object
          additionalProperties: {type: string}
          description: Up to 20 keys; returned on the payment and in webhooks
          example: {order_id: "A-1001"}
        customer:
          type: object
          description: Used by the risk checks (blocklist, velocity per customer and IP); send what you have
          properties:
            email: {type: string}
            name: {type: string}
            phone: {type: string, example: "+251911234567"}
            ip: {type: string, description: "The customer's IP as your server saw it", example: "196.188.10.20"}
        return_url: {type: string, description: Where the customer goes after paying}
        expires_in_minutes: {type: integer, minimum: 5, maximum: 1440, default: 30}
    Payment:
      type: object
      example: {"id": "7b9e2c1a-3f4d-4e8a-9b6c-1d2e3f4a5b6c", "merchant_id": "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d", "environment": "test", "amount": 150000, "fee": 2250, "refunded_amount": 0, "currency": "ETB", "status": "processing", "payment_method": "telebirr", "provider": "mock", "reference": "ORDER-1001", "description": "2 x Yirgacheffe coffee 500g", "metadata": {"order_id": "1001", "customer_id": "C-77"}, "checkout_url": "http://localhost:8080/providers/mock/checkout/7b9e2c1a-3f4d-4e8a-9b6c-1d2e3f4a5b6c", "expires_at": "2026-10-28T10:00:00Z", "created_at": "2026-10-28T09:30:00Z", "updated_at": "2026-10-28T09:30:01Z"}
      properties:
        id: {type: string, format: uuid}
        merchant_id: {type: string}
        environment: {type: string, enum: [live, test]}
        amount: {type: integer, format: int64}
        fee: {type: integer, format: int64}
        refunded_amount: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string, enum: [pending, processing, succeeded, failed, expired, partially_refunded, refunded]}
        payment_method: {type: string}
        provider: {type: string, description: The provider the method was routed to}
        reference: {type: string}
        description: {type: string}
        metadata: {type: object, additionalProperties: {type: string}}
        checkout_url: {type: string}
        failure_reason: {type: string}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Refund:
      type: object
      example: {"id": "d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f7a", "payment_id": "7b9e2c1a-3f4d-4e8a-9b6c-1d2e3f4a5b6c", "amount": 50000, "currency": "ETB", "status": "succeeded", "reason": "Customer returned one item", "created_at": "2026-10-28T11:00:00Z"}
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: string}
        amount: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string, enum: [pending, succeeded, failed]}
        reason: {type: string}
        failure_reason: {type: string}
        created_at: {type: string, format: date-time}
    Payout:
      type: object
